latex:
  # tectonic | latexmk | pdflatex. Leave unset to auto-detect in that order.
  # tectonic is recommended: one binary, fetches its own packages.
  engine:

ai:
  # The CLI to shell out to for feedback and tailoring. Whatever you have:
  # claude, codex, gemini, agy, or any command that reads a prompt file.
  # Choose the matching preset in Settings; each CLI takes different arguments.
  #
  # The child always runs in an empty scratch directory containing nothing but
  # the prompt — not your store, not your home directory, not this source tree.
  # These flags add each CLI's own read-only mode on top of that.
  #   {prompt}      path to a file holding the prompt
  #   {promptText}  the prompt inline, for CLIs that insist on an argument
  #   {sandbox}     the scratch directory, for CLIs that take an allow-list
  command: claude
  args: ["-p", "--add-dir", "{sandbox}", "--disallowedTools", "Bash,Write,Edit,WebFetch,WebSearch", "{prompt}"]
  # Off by default. Turn on once you have confirmed the command above works;
  # while off, the AI endpoints return the prompt they *would* have run.
  enabled: false
  timeoutMs: 180000

git:
  # Commit every change to data/ automatically, so the store has real history.
  autoCommit: true

output:
  # Where built PDFs, bundles and the flat upload folder go.
  #
  # Inside the save, which is where every save the app itself makes puts them
  # — `cloneProject` writes `withinProject: true` on each one. This file is the
  # seed for a save made by pointing `rmm serve --data` at an empty folder, and
  # it was the one that did not say so: without the flag the path resolves
  # against the save's *parent*, so `rmm serve --data ~/Documents/resumes` put
  # an `out/` full of PDFs in ~/Documents, and two saves seeded side by side
  # shared one. The flat folder is rebuilt from whichever tracker asked last,
  # so sharing it means one save quietly tidies away the other's files.
  #
  # Only new saves are seeded from here, so nothing already on disk moves.
  dir: out
  withinProject: true
