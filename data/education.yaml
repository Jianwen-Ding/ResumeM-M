# Education entries. Note `dates`: one entry, two graduation dates, selected
# per resume. This is the whole reason the variant system exists — switching
# between new-grad and intern applications must not mean two copies of a file.
- id: edu_neu
  kind: education
  title: Northeastern University
  location: Boston, MA
  subtitle:
    default: v_bs_cs
    variants:
      - id: v_bs_cs
        label: BS Computer Science
        text: Bachelor of Science in Computer Science
      - id: v_bs_cs_gpa
        label: BS Computer Science + GPA
        text: Bachelor of Science in Computer Science, GPA 3.8/4.0
        tags: [gpa]
        note: Use when the posting asks for GPA or is GPA-screened.
  dates:
    default: v_may2026
    variants:
      - id: v_may2026
        label: May 2026 (new grad)
        text: Sep. 2022 -- May 2026
        tags: [newgrad]
      - id: v_dec2026
        label: Dec 2026 (intern)
        text: Sep. 2022 -- Dec. 2026
        tags: [intern]
        note: Later date keeps intern eligibility for summer 2026.
  bullets:
    # A list bullet: the decision here is which courses to show, not how to
    # word them, so the editor offers checkboxes rather than a dropdown and a
    # resume stores its selection under `lists` instead of `choices`.
    - id: b_edu_coursework
      default: v_list
      prefix: "**Relevant Coursework:**"
      separator: ", "
      variants: []
      items:
        - { id: c_algorithms, text: Algorithms, tags: [general, systems, ml] }
        - { id: c_ood, text: Object-Oriented Design, tags: [general, backend] }
        - { id: c_systems, text: Computer Systems, tags: [systems, backend, infrastructure] }
        - { id: c_os, text: Operating Systems, tags: [systems, infrastructure] }
        - { id: c_databases, text: Databases, tags: [general, backend, data] }
        - { id: c_networks, text: Networks, tags: [systems, distributed] }
        - { id: c_distributed, text: Distributed Systems, tags: [distributed, systems] }
        - { id: c_theory, text: Theory of Computation, tags: [general] }
        - { id: c_ml, text: Machine Learning, tags: [ml, ai] }
        - { id: c_linalg, text: Linear Algebra, tags: [ml, ai] }
        - { id: c_prob, text: Probability & Statistics, tags: [ml, data] }
        - { id: c_datamining, text: Data Mining, tags: [ml, data] }
