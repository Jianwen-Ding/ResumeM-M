# Skills are individually selectable so a resume can drop the noise a given
# posting does not care about, without deleting anything from the store.
- id: sk_languages
  name: Languages
  items:
    - { id: s_python, text: Python, tags: [python, backend, ml] }
    - { id: s_ts, text: TypeScript, tags: [typescript, frontend, fullstack] }
    - { id: s_java, text: Java, tags: [java, backend] }
    - { id: s_go, text: Go, tags: [go, backend, distributed] }
    - { id: s_c, text: C, tags: [systems] }
    - { id: s_sql, text: SQL, tags: [data, backend] }

