<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeM-M</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ResumeM-M</h1>
  <nav id="tabs">
    <button data-tab="build" class="active">Build</button>
    <button data-tab="master">Master</button>
    <button data-tab="applications">Applications</button>
    <button data-tab="voice">Voice</button>
  </nav>
  <span id="status" class="status"></span>
</header>

<main>
  <!-- Build: mix and match variants, preview the compiled PDF beside it. -->
  <section id="tab-build" class="tab active">
    <div class="split">
      <div class="pane pane-left">
        <div class="toolbar">
          <select id="resume-select" title="Which resume to edit"></select>
          <button id="btn-render" class="primary">Preview</button>
          <button id="btn-save-as">Save as variation…</button>
          <button id="btn-feedback">Get feedback</button>
        </div>
        <div id="fit" class="fit"></div>
        <div id="warnings" class="warnings"></div>
        <div id="editor"></div>
      </div>
      <div class="pane pane-right">
        <iframe id="preview" title="Resume preview"></iframe>
      </div>
    </div>
  </section>

  <!-- Master: every entry, bullet, and phrasing, for browsing what exists. -->
  <section id="tab-master" class="tab">
    <div class="toolbar">
      <button id="btn-master" class="primary">Rebuild master document</button>
      <span class="hint">Everything in the store, labelled with its id. Not a resume — an inventory.</span>
    </div>
    <iframe id="master-preview" title="Master document"></iframe>
  </section>

  <!-- Applications: the tracker. -->
  <section id="tab-applications" class="tab">
    <div id="stats" class="stats"></div>
    <div class="toolbar">
      <button id="btn-add-app">Record an application</button>
    </div>
    <table id="apps">
      <thead><tr><th>Date</th><th>Company</th><th>Role</th><th>Status</th><th>Resume</th><th>Files</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Voice: the standing instructions every AI request carries. -->
  <section id="tab-voice" class="tab">
    <p class="hint">
      These notes are prepended to every AI request, so you never paste the same
      instructions into a fresh chat again. Describe how you write, not what you did.
    </p>
    <textarea id="voice" spellcheck="false"></textarea>
    <div class="toolbar"><button id="btn-save-voice" class="primary">Save</button></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-body">
    <h2 id="modal-title"></h2>
    <div id="modal-content"></div>
    <div class="toolbar">
      <button id="modal-ok" class="primary">OK</button>
      <button id="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
